<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Kubernetes Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 20px;
        }
        .task-card {
            margin-bottom: 15px;
        }
        .server-info {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="mb-4">
            <div class="row">
                <div class="col-md-8">
                    <h1>Task Manager</h1>
                    <p class="lead">A Kubernetes Demo Application with Flask and MySQL</p>
                </div>
                <div class="col-md-4 text-end">
                    <div class="server-info">
                        <p>Pod: <span id="hostname">{{ hostname }}</span></p>
                        <p>Status: <span id="app-status" class="badge bg-success">Connected</span></p>
                    </div>
                </div>
            </div>
        </header>

        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">Add New Task</div>
                    <div class="card-body">
                        <form id="task-form">
                            <div class="mb-3">
                                <label for="title" class="form-label">Title</label>
                                <input type="text" class="form-control" id="title" required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="status" class="form-label">Status</label>
                                <select class="form-select" id="status">
                                    <option value="pending">Pending</option>
                                    <option value="in-progress">In Progress</option>
                                    <option value="completed">Completed</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">Add Task</button>
                        </form>
                    </div>
                </div>
                
                <div class="card mt-4">
                    <div class="card-header">Testing Tools</div>
                    <div class="card-body">
                        <button id="load-test-btn" class="btn btn-warning mb-2" data-bs-toggle="modal" data-bs-target="#loadTestModal">
                            Generate Load Test
                        </button>
                        <button id="check-status-btn" class="btn btn-info">
                            Check API Status
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-8">
                <h3>Tasks <button id="refresh-tasks" class="btn btn-sm btn-outline-secondary ms-2">Refresh</button></h3>
                <div id="tasks-container" class="mt-3">
                    <div class="d-flex justify-content-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Load Test Modal -->
    <div class="modal fade" id="loadTestModal" tabindex="-1" aria-labelledby="loadTestModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loadTestModalLabel">Generate Load Test</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Create test tasks to simulate load on the application and database.</p>
                    <div class="mb-3">
                        <label for="taskCount" class="form-label">Number of tasks to create</label>
                        <input type="number" class="form-control" id="taskCount" value="10" min="1" max="100">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="start-load-test">Start Test</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Modal -->
    <div class="modal fade" id="statusModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">System Status</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <pre id="status-content" class="bg-light p-3"></pre>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // API endpoints
        const API_ENDPOINTS = {
            TASKS: '/api/tasks',
            LOAD_TEST: '/api/load-test',
            STATUS: '/api/status'
        };

        // DOM elements
        const taskForm = document.getElementById('task-form');
        const tasksContainer = document.getElementById('tasks-container');
        const refreshTasksBtn = document.getElementById('refresh-tasks');
        const loadTestBtn = document.getElementById('start-load-test');
        const taskCountInput = document.getElementById('taskCount');
        const statusBtn = document.getElementById('check-status-btn');
        const statusContent = document.getElementById('status-content');
        const appStatus = document.getElementById('app-status');
        
        // Load tasks on page load
        document.addEventListener('DOMContentLoaded', fetchTasks);
        
        // Event listeners
        taskForm.addEventListener('submit', addTask);
        refreshTasksBtn.addEventListener('click', fetchTasks);
        loadTestBtn.addEventListener('click', runLoadTest);
        statusBtn.addEventListener('click', checkStatus);

        // Fetch all tasks
        function fetchTasks() {
            tasksContainer.innerHTML = '<div class="d-flex justify-content-center"><div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div></div>';
            
            fetch(API_ENDPOINTS.TASKS)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        displayTasks(data.tasks);
                    } else {
                        showError('Failed to fetch tasks');
                    }
                })
                .catch(error => {
                    console.error('Error fetching tasks:', error);
                    showError('Could not connect to server');
                    appStatus.textContent = 'Disconnected';
                    appStatus.className = 'badge bg-danger';
                });
        }

        // Display tasks in the UI
        function displayTasks(tasks) {
            if (!tasks || tasks.length === 0) {
                tasksContainer.innerHTML = '<div class="alert alert-info">No tasks found. Add one to get started!</div>';
                return;
            }

            tasksContainer.innerHTML = '';
            tasks.forEach(task => {
                const statusClass = getStatusClass(task.status);
                const taskCard = document.createElement('div');
                taskCard.className = 'card task-card';
                taskCard.innerHTML = `
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>${task.title}</span>
                        <span class="badge ${statusClass}">${task.status}</span>
                    </div>
                    <div class="card-body">
                        <p>${task.description || 'No description'}</p>
                        <small class="text-muted">Created: ${new Date(task.created_at).toLocaleString()}</small>
                        <div class="mt-2">
                            <button class="btn btn-sm btn-danger delete-task" data-id="${task.id}">Delete</button>
                        </div>
                    </div>
                `;
                tasksContainer.appendChild(taskCard);

                // Add event listener for delete button
                const deleteBtn = taskCard.querySelector('.delete-task');
                deleteBtn.addEventListener('click', () => deleteTask(task.id));
            });
        }

        // Add a new task
        function addTask(e) {
            e.preventDefault();
            
            const taskData = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                status: document.getElementById('status').value
            };
            
            fetch(API_ENDPOINTS.TASKS, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(taskData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    taskForm.reset();
                    fetchTasks();
                } else {
                    showError('Failed to add task: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error adding task:', error);
                showError('Could not connect to server');
            });
        }

        // Delete a task
        function deleteTask(taskId) {
            fetch(`${API_ENDPOINTS.TASKS}/${taskId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    fetchTasks();
                } else {
                    showError('Failed to delete task: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error deleting task:', error);
                showError('Could not connect to server');
            });
        }

        // Run load test
        function runLoadTest() {
            const count = parseInt(taskCountInput.value) || 10;
            
            fetch(API_ENDPOINTS.LOAD_TEST, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ count })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(`Successfully created ${count} test tasks!`);
                    bootstrap.Modal.getInstance(document.getElementById('loadTestModal')).hide();
                    fetchTasks();
                } else {
                    showError('Load test failed: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error running load test:', error);
                showError('Could not connect to server');
            });
        }

        // Check system status
        function checkStatus() {
            fetch(API_ENDPOINTS.STATUS)
                .then(response => response.json())
                .then(data => {
                    statusContent.textContent = JSON.stringify(data, null, 2);
                    new bootstrap.Modal(document.getElementById('statusModal')).show();
                })
                .catch(error => {
                    console.error('Error checking status:', error);
                    showError('Could not connect to server');
                });
        }

        // Helper function to show error
        function showError(message) {
            const errorAlert = document.createElement('div');
            errorAlert.className = 'alert alert-danger alert-dismissible fade show';
            errorAlert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            document.querySelector('.container').insertBefore(errorAlert, document.querySelector('.row'));
            
            // Auto dismiss after 5 seconds
            setTimeout(() => {
                errorAlert.classList.remove('show');
                setTimeout(() => errorAlert.remove(), 150);
            }, 5000);
        }

        // Helper function to get status badge class
        function getStatusClass(status) {
            switch(status.toLowerCase()) {
                case 'completed': return 'bg-success';
                case 'in-progress': return 'bg-primary';
                case 'test': return 'bg-warning';
                default: return 'bg-secondary';
            }
        }
    </script>
</body>
</html>
