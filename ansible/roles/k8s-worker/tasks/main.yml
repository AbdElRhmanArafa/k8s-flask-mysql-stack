---

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}_{{ groups['workers'].index(inventory_hostname) + 1 }}"

- name: Check if containerd is installed and running
  ansible.builtin.service:
    name: containerd
    state: started
  register: containerd_status
  failed_when: containerd_status.state is not defined or containerd_status.state != "started"

- name: Join the worker node to the Kubernetes cluster
  shell: |
    {{ hostvars[groups['control_plane'][0]].kubeadm_join_command }}
  register: join_result
  failed_when:
  - join_result.rc != 0
  - "'already exists' not in join_result.stderr"
  notify: Verify worker node is added to the cluster
