apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flaskapp.fullname" . }}-config
  labels:
    {{- include "flaskapp.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.database.host | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
