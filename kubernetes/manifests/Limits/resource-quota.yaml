apiVersion: v1
kind: ResourceQuota
metadata:
  name: app-resource-quota
  namespace: default
spec:
  hard:
    # CPU and Memory quotas
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "6"
    limits.memory: 12Gi

    # Pod count quota
    pods: "20"

    # Persistent volume claims quota
    persistentvolumeclaims: "10"

    # Other resource quotas
    configmaps: "20"
    secrets: "20"
    services: "15"
    services.loadbalancers: "2"
    services.nodeports: "5"

    # Storage quota
    requests.storage: 50Gi
