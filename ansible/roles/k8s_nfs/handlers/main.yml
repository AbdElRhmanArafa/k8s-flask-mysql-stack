---

- name: restart nfs-kernel-server
  ansible.builtin.service:
    name: nfs-kernel-server
    state: restarted
  become: true

- name: reload nfs exports
  ansible.builtin.command: exportfs -ra
  become: true

- name: start nfs-kernel-server
  ansible.builtin.service:
    name: nfs-kernel-server
    state: started
    enabled: true
  become: true
